<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Kaçış: Zeliha &amp; Okan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" width="960" height="540" tabindex="0" aria-label="Kaçış Gecesi oyunu"></canvas>
  <div id="rotate">📱 Daha iyi oynamak için telefonu yatay çevir</div>
  <div id="touch" aria-hidden="true">
    <div class="pad pad-left">
      <button data-key="ArrowLeft">◀</button>
      <button data-key="ArrowRight">▶</button>
    </div>
    <div class="pad pad-right">
      <button data-key="ArrowDown">▼</button>
      <button data-key="ArrowUp">▲</button>
    </div>
  </div>
  <script src="js/avatars.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
